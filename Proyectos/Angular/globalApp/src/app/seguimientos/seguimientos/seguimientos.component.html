<div class="d-flex justify-content-center" style="margin-top: 20%" *ngIf="spinner">
  <mat-spinner></mat-spinner>
</div>

<div class="row mt-3" *ngIf="!spinner">
  <div class="col-sm-8">
    <mat-form-field appearance="legacy">
      <mat-label>Buscar...</mat-label>
      <input matInput placeholder="Buscar..." (keyup)="applyFilter($event.target.value)" [(ngModel)]="valorFiltro">
      <!-- <mat-icon matSuffix (click)="buscar()">search</mat-icon> -->
    </mat-form-field>
  </div> <!-- col 6 -->
  <div class="col-sm-4">
    <button mat-raised-button (click)="crearSeguimiento()" class="float-right" color="primary" *ngIf="permisoSeguimiento">Nuevo Seguimiento <mat-icon aria-hidden="false" aria-label="Nuevo Seguimiento">add</mat-icon></button>
  </div> <!-- col 13 -->  
</div> <!--  div 5 -->

<div class="mat-elevation-z8" *ngIf="!spinner">
  <table mat-table [dataSource]="seguimientosFiltrados | paginador:pageSize:pageIndex" #table>
   
    <!-- Imágen -->
    <ng-container matColumnDef="foto">
      <th mat-header-cell *matHeaderCellDef> Foto </th>
      <td mat-cell *matCellDef="let element"> <img src="assets\{{element.foto}}" id="zoom"/> </td>
    </ng-container>

    <!-- fecha Column -->
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Fecha </th>
      <td mat-cell *matCellDef="let element"> {{element.fecha | date:'medium'}} </td>
    </ng-container>

    <!-- supervisor Column -->
    <ng-container matColumnDef="supervisor">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Supervisor </th>
      <td mat-cell *matCellDef="let element"> {{element.supervisor}} </td>
    </ng-container>

    <!-- observado Column -->
    <ng-container matColumnDef="observado">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Observado </th>
      <td mat-cell *matCellDef="let element"> {{element.observado}} </td>
    </ng-container>

    <!-- sector Column -->
    <ng-container matColumnDef="sector">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Sector </th>
      <td mat-cell *matCellDef="let element"> {{element.sector}} </td>
    </ng-container>

    <!-- tipo observacion Column -->
    <ng-container matColumnDef="observacion">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Tipo </th>
      <td mat-cell *matCellDef="let element"> {{element.observacion}} </td>
    </ng-container>

    <!-- calificacion Column -->
    <ng-container matColumnDef="calificacion">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Calificación </th>
      <td mat-cell *matCellDef="let element" class="text-center"> {{element.calificacion}} </td>
    </ng-container>   

    <!-- detaller Column -->
    <ng-container matColumnDef="detalle">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Detalle </th>
      <td mat-cell *matCellDef="let element"> {{element.detalle}} </td>
    </ng-container>

    <!-- ir a empleado Column -->
    <ng-container matColumnDef="irA">
      <th mat-header-cell *matHeaderCellDef> Ver empleado </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" (click)="irAseguimientoEmpleado(element)">
            <mat-icon class="mat-18">face</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Borrar Column -->
    <ng-container matColumnDef="borrar">
      <th mat-header-cell *matHeaderCellDef> Borrar </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="warn" (click)="borrar(element.id)">
            <mat-icon class="mat-18">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
    [ngClass]="{'calPositiva': row.calificacion=='+', 'calNegativa': row.calificacion=='-', 'calNeutra': row.calificacion=='N'}"></tr>
  </table>

  <!-- Paginador -->
  <mat-paginator  [length]="seguimientosFiltrados.length"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                [showFirstLastButtons]="true"
                (page)="pageEvent = handlePage($event)"
                *ngIf="todosLosSeguimientos"
                [pageIndex] = "pageIndex"
                >
  </mat-paginator>

</div>
