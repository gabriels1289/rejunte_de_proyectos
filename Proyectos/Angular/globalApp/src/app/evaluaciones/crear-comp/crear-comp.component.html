<div class="d-flex justify-content-center" *ngIf="spinner">
  <mat-spinner></mat-spinner>
</div>

<div class="card border-info" *ngIf="!spinner" cdkTrapFocus>
  <div class="card-header bg-info text-capitalize text-center">
    <h2 mat-dialog-title>Crear Competencia/Comportamiento</h2>
  </div>

  <div class="card-body">
    <mat-dialog-content [formGroup]="form">
      
      <!-- calificacion -->
      <mat-form-field>
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="tipoCtrl" required>
          <mat-option *ngFor="let tipo of tipos" [value]="tipo">
            {{tipo.descripcion}}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="f.tipoCtrl.hasError('required')">Por favor seleccione un tipo</mat-error>
      </mat-form-field>
    
      <mat-form-field hintLabel="Max 500 caracteres">
        <textarea matInput placeholder="detalle" formControlName="detalleCtrl" required></textarea>
        <mat-hint align="end">{{f.detalleCtrl.value?.length || 0}}/500</mat-hint>
        <mat-error *ngIf="f.detalleCtrl.invalid">{{getErrorMessageMinMaxRequired('detalleCtrl')}}</mat-error>
      </mat-form-field>

    </mat-dialog-content>
  </div> <!-- div 10 -->

  <div class="card-footer">
		<button mat-raised-button (click)="close()" color="warn" class="float-left">Cerrar <mat-icon>cancel</mat-icon></button>
    <button mat-raised-button (click)="save()" color="primary" class="float-right" cdkFocusInitial [disabled]="deshabilitado">Guardar <mat-icon>save</mat-icon></button>
	</div> <!-- div 33 -->
</div> <!-- div 5 -->
