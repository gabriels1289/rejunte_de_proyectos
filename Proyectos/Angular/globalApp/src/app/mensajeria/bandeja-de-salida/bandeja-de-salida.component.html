<div class="d-flex justify-content-center" style="margin-top: 20%" *ngIf="spinner">
  <mat-spinner></mat-spinner>
</div>


<div class="card border-info" *ngIf="todosLosCorreos">
  <div class="card-body">
    <mat-nav-list>
      <mat-list-item *ngFor="let correo of todosLosCorreos | paginador:pageSize:pageIndex" [class.selected]="correo.id == selectedId" 
        [ngClass]="{'sin-leer': correo.leido=='N', 'leido': correo.leido=='S', 'destacado': correo.destacado=='I'}">
        <img matListAvatar src="assets\{{correo.foto}}" alt="{{correo.nombreapellido}}" id="zoom">
        <h3 matLine (click)="detalle(correo)">{{correo.nombreapellido}}</h3>
        <h4 matLine> {{correo.fecha | date:'medium'}} - Area: {{correo.area}} </h4>
        <p matLine> {{correo.asunto}} </p>
        
        <div class="d-flex flex-row">
          <mat-icon matTooltip="Destacar" matTooltipPosition="left" (click)="destacar(correo)">priority_high</mat-icon>
          <mat-icon class="ml-3" matTooltip="Reenviar" matTooltipPosition="left" (click)="goToReenviar(correo)">send</mat-icon>
        </div>
        <mat-divider [inset]="true" *ngIf="!last"></mat-divider>
      </mat-list-item>
    </mat-nav-list>
  </div>
</div>

<mat-paginator  [length]="todosLosCorreos.length"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                [showFirstLastButtons]="true"
                (page)="pageEvent = handlePage($event)"
                *ngIf="todosLosCorreos"
                [pageIndex] = "pageIndex"
                >
</mat-paginator>
