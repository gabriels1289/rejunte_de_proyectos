<div class="d-flex justify-content-center" style="margin-top: 20%" *ngIf="spinner">
  <mat-spinner></mat-spinner>
</div>

<div class="example-container" *ngIf="!spinner">
  <div class="row  mt-3">
    <div class="col-sm-8">
      <mat-form-field appearance="legacy">
        <mat-label>Buscar...</mat-label>
        <input matInput placeholder="Buscar por area... ejemplo: operador, gte rrhh" (keyup)="applyFilter($event.target.value)" [(ngModel)]="valorFiltro">
        <!-- <mat-icon matSuffix (click)="buscar()">search</mat-icon> -->
      </mat-form-field>
    </div> <!-- div 7 -->
    <div class="col-sm-2">
      <mat-form-field>
        <mat-label>Estado:</mat-label>
        <mat-select [(ngModel)]="selectedValue" (selectionChange)="onChangeOption()">
          <mat-option *ngFor="let estado of estados" [value]="estado.value">
            {{estado.viewValue}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div> <!-- div 14 -->
    <div class="col-sm-2">
      <button mat-raised-button (click)="cargarEditar(variableNull)" color="primary">Cargar Contenido <mat-icon>assignment</mat-icon></button>
    </div> <!-- div 24 -->
  </div> <!-- div 6 -->
</div> <!-- div 5 -->

<div class="mat-elevation-z8" *ngIf="!spinner">
  <table mat-table [dataSource]="recursosFiltrados | paginador:pageSize:pageIndex">

    <!-- id Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> Id </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- titulo Column -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let element"> {{element.titulo}} </td>
    </ng-container>

    <!-- comentario Column -->
    <ng-container matColumnDef="comentario">
      <th mat-header-cell *matHeaderCellDef> Comentario </th>
      <td mat-cell *matCellDef="let element"> {{element.comentario}} </td>
    </ng-container>

    <!-- Menús Column -->
    <ng-container matColumnDef="menu">
      <th mat-header-cell *matHeaderCellDef class="text-center"> Menú </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button matTooltip="Ver Detalle" color="primary" (click)="verDetalle(element)"><mat-icon class="mat-18">pageview</mat-icon></button>
        <button mat-icon-button color="primary" (click)="altaBaja(element)">
          <mat-icon class="mat-18" *ngIf="element.activo == 'N'" matTooltip="Dar de alta">check</mat-icon>
          <mat-icon class="mat-18" *ngIf="element.activo == 'A'" matTooltip="Dar de baja">close</mat-icon>
        </button>
        <button mat-icon-button matTooltip="Editar" color="primary" (click)="cargarEditar(element)"><mat-icon class="mat-18">create</mat-icon></button>
        <!-- <button mat-icon-button matTooltip="Borrar" color="warn" (click)="borrar(element)"><mat-icon class="mat-18">delete</mat-icon></button> -->
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" [ngClass]="{'documento': row.tipo=='D', 'video': row.tipo=='V', 'desactivado': row.activo!='A'}"></tr>
  </table>

  <!-- Paginador -->
  <mat-paginator  [length]="recursosFiltrados.length"
                [pageSize]="pageSize"
                [pageSizeOptions]="pageSizeOptions"
                [showFirstLastButtons]="true"
                (page)="pageEvent = handlePage($event)"
                *ngIf="todosLosRecursos"
                [pageIndex] = "pageIndex"
                >
  </mat-paginator>

</div>
