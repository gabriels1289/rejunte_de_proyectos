<div class="card" [ngClass]="{'border-info': tipo=='primary', 'border-success': tipo=='success', 'border-warning': tipo=='warning', 'border-danger': tipo=='danger'}" cdkTrapFocus>
	<div class="card-header text-capitalize" [ngClass]="{'bg-info': tipo=='primary', 'bg-success': tipo=='success', 'bg-warning': tipo=='warning', 'bg-danger': tipo=='danger'}">
		<h2 mat-dialog-title class="text-center">{{titulo}}</h2>
	</div>
	<div class="card-body">
		<mat-dialog-content>
			{{ mensaje }}
		</mat-dialog-content>
	</div>
	<div class="card-footer">
    <button mat-raised-button mat-dialog-close="false" color="warn" class="float-left">Cancelar</button>
		<button mat-raised-button mat-dialog-close="true" color="primary" cdkFocusInitial class="float-right">Aceptar</button>
	</div>
</div>
